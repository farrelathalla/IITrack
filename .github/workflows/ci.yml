name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Prisma butuh URL yang bisa diurai untuk membaca konfigurasinya. Tidak ada
      # koneksi yang dibuka: pipeline hanya menjalankan lint, typecheck, dan test
      # yang tidak menyentuh basis data.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/iitrack

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
